<!-- Lipiți acest bloc într-un bloc „HTML personalizat" pe pagina de pe smart.org.ro. -->
<iframe id="smart-finantari-rurale" src="https://iulian-smart.github.io/finantari-rurale/" title="Finanțări rurale active"
        style="width:100%;border:0;min-height:900px;display:block" loading="lazy"></iframe>
<script>
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'smart-finantari-rurale-height') {
      document.getElementById('smart-finantari-rurale').style.height = (e.data.height + 20) + 'px';
    }
  });
</script>
